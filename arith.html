<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addtion of Two Numbers</title>
</head>
<body>
    <script> 
        let a=10;
        let b=20;
        let sum=a+b;
        console.log("Sum=",sum);
        let sub=a-b;
        console.log("Sub=",sub);
        let mul=a*b;
        console.log("Mul=",mul);
        let mod=a%b;
        document.write("Mod=",mod);
        let div=a/b;
        document.write("Div=",div);
    </script>
</body>
</html>
